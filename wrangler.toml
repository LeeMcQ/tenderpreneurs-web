name = "tenderpreneurs"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "tenderpreneurs"
database_id = "ec19d49a-aac9-4519-b4bf-1af9449c88a0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TENDERPRENEURS_TENDERS"
bucket_name = "tenderpreneurs-tenders"

[vars]
PUBLIC_SITE_URL    = "https://tenderpreneurs.co.za"
SESSION_TTL_DAYS   = "30"
MAGIC_LINK_TTL_MIN = "15"
AUDIT_EMAIL_TO     = "mogulbyte1@gmail.com"
AUDIT_EMAIL_FROM   = "audit@tenderpreneurs.co.za"
AUTH_EMAIL_FROM    = "no-reply@tenderpreneurs.co.za"
