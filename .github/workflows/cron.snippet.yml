# ----- Tier 3: Catch-all bulletin (weekly Fridays only) -----
# This step only runs on Fridays since the GTB is published weekly.
# The PDF can be ~50 MB so it gets a longer timeout.

      - name: Fetch Government Tender Bulletin PDF (Fridays)
        if: github.event.schedule == '0 18 * * 5' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://tenderpreneurs.pages.dev
        run: node .github/scripts/fetch-gtb.js
        continue-on-error: true
        timeout-minutes: 10

# ----- Step at the end: check overall health and notify on regression -----
# This runs even if some scrapers failed. It hits the admin health endpoint
# and triggers WhatsApp/email alerts if any source has been failing for ≥ 3 days.

      - name: Check scraper health & alert on regression
        if: always()   # runs even if earlier steps failed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://tenderpreneurs.pages.dev
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
        run: node .github/scripts/check-scraper-health.js
        continue-on-error: true
        timeout-minutes: 2
