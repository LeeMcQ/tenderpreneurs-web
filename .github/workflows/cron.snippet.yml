# .github/workflows/cron.yml — SNIPPET TO MERGE INTO YOUR EXISTING WORKFLOW
#
# These steps go INSIDE the existing `ingest` job, AFTER the OCDS fetch step.
# Do not create a new job for these — staying in one job avoids burning Actions
# minutes on duplicate environment setup.
#
# Each step has:
#   - continue-on-error: true   → one failing scraper can't kill the others
#   - timeout-minutes: 5        → workflow-level hard cap (belt-and-braces with
#                                 the in-script TIME_BUDGET_MS in common.js)
#
# Final summary step at the bottom collects results.

# ----- Tier 1: Metro municipalities -----

      - name: Fetch City of Cape Town tenders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://tenderpreneurs.pages.dev
        run: node .github/scripts/fetch-city-cape-town.js
        continue-on-error: true
        timeout-minutes: 5

