name: P0 Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run P0 tests
        run: pnpm test:p0
        env:
          BASE_URL: https://tenderpreneurs.pages.dev
      - name: Lighthouse
        run: pnpm test:perf
      - name: Check dead links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --base https://tenderpreneurs.pages.dev https://tenderpreneurs.pages.dev/sitemap.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/ }