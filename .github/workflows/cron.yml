name: Tenderpreneurs Cron

on:
  schedule:
    - cron: '0 */6 * * *'   # ingest every 6h
    - cron: '0 6 * * *'      # audit daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'ingest-all'
        type: choice
        options:
          - ingest-etenders
          - ingest-all
          - audit

jobs:
  # ── eTenders ingestion ─────────────────────────────────────────────────────
  ingest-etenders:
    name: Ingest eTenders
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'ingest-etenders' ||
      github.event.inputs.job == 'ingest-all'
    timeout-minutes: 5
    steps:
      - name: Trigger eTenders ingest
        run: |
          echo "Triggering etenders ingest at $(date -u)"
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            "https://tenderpreneurs.pages.dev/api/cron/ingest?source=etenders")
          echo "HTTP $HTTP"; cat /tmp/body.txt
          [ "$HTTP" -eq 200 ] || exit 1

  # ── Audit ──────────────────────────────────────────────────────────────────
  audit:
    name: Daily audit
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      github.event.inputs.job == 'audit'
    timeout-minutes: 2
    steps:
      - name: Trigger audit
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30 \
            "https://tenderpreneurs.pages.dev/api/cron/audit")
          echo "HTTP $HTTP"; cat /tmp/body.txt
          [ "$HTTP" -eq 200 ] || exit 1

# Setup: add CRON_SECRET secret at
# https://github.com/LeeMcQ/tenderpreneurs-web/settings/secrets/actions
# Value = SESSION_SECRET from your Cloudflare Pages env vars
