name: Tenderpreneurs Cron

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        default: 'ingest'
        type: choice
        options: [ingest, audit, alerts, both]

jobs:
  ingest:
    name: Fetch & ingest tenders
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'ingest' || github.event.inputs.job == 'both')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official eTenders OCDS API + push
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://tenderpreneurs.co.za' }}
        run: node .github/scripts/fetch-etenders-ocds.js
      - name: Fetch eTenders OCP dump + push (backfill)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://tenderpreneurs.co.za' }}
        run: node .github/scripts/fetch-etenders.js
      - name: Ingest public SOE and metro adapters
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://tenderpreneurs.co.za' }}
        run: |
          fail=0
          for source in sanral eskom transnet cct acsa dbsa coj tshwane ekurhuleni; do
            HTTP=$(curl -s -o "/tmp/${source}.txt" -w "%{http_code}" \
              -X POST \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              --max-time 90 \
              "${SITE_URL}/api/cron/ingest?source=${source}")
            echo "${source} HTTP $HTTP"
            cat "/tmp/${source}.txt"
            echo
            [ "$HTTP" -eq 200 ] || fail=1
          done
          exit $fail

  audit:
    name: Daily audit
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'audit' || github.event.inputs.job == 'both'))
    timeout-minutes: 2
    steps:
      - name: Trigger audit endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://tenderpreneurs.co.za' }}
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30 \
            "${SITE_URL}/api/cron/audit")
          echo "HTTP $HTTP"; cat /tmp/body.txt
          [ "$HTTP" -eq 200 ] || exit 1

  alerts:
    name: Closing alerts
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'alerts')
    timeout-minutes: 3
    steps:
      - name: Trigger closing-alert emails
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://tenderpreneurs.co.za' }}
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 45 \
            "${SITE_URL}/api/cron/closing-alerts")
          echo "HTTP $HTTP"; cat /tmp/body.txt
          [ "$HTTP" -eq 200 ] || exit 1
